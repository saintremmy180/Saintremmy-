<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify-Style MP3 Player</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for media icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="player-container" id="playerContainer">
        <!-- Header & Local File Upload -->
        <div class="player-header">
            <span class="brand"><i class="fa-brands fa-spotify"></i> Music Player</span>
            <label for="audioUpload" class="upload-btn" title="Load your local MP3 file">
                <i class="fa-solid fa-folder-open"></i> Load MP3
            </label>
            <input type="file" id="audioUpload" accept="audio/*" hidden>
        </div>

        <!-- Album Art -->
        <div class="album-art-wrapper">
            <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?auto=format&fit=crop&w=500&q=80" alt="Album Cover" id="coverArt">
        </div>

        <!-- Track Metadata -->
        <div class="track-info">
            <div class="track-details">
                <h2 id="trackTitle">Worldwide</h2>
                <p id="artistName">Asake</p>
            </div>
            <button class="like-btn" id="likeBtn"><i class="fa-regular fa-heart"></i></button>
        </div>

        <!-- Progress Bar -->
        <div class="progress-section">
            <div class="progress-bar-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="time-stamps">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>

        <!-- Media Controls -->
        <div class="controls">
            <button class="control-btn" id="shuffleBtn" title="Shuffle"><i class="fa-solid fa-shuffle"></i></button>
            <button class="control-btn" id="prevBtn" title="Previous"><i class="fa-solid fa-backward-step"></i></button>
            <button class="play-pause-btn" id="playPauseBtn" title="Play/Pause">
                <i class="fa-solid fa-play" id="playIcon"></i>
            </button>
            <button class="control-btn" id="nextBtn" title="Next"><i class="fa-solid fa-forward-step"></i></button>
            <button class="control-btn" id="repeatBtn" title="Repeat"><i class="fa-solid fa-repeat"></i></button>
        </div>

        <!-- Volume Control -->
        <div class="volume-section">
            <i class="fa-solid fa-volume-high" id="volumeIcon"></i>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
        </div>

        <!-- Status Message -->
        <p class="status-msg" id="statusMsg">Load "Worldwide - Asake.mp3" or play demo audio</p>
    </div>

    <!-- Hidden Audio Element (Includes a fallback royalty-free beat if no local file is loaded) -->
    <audio id="audioPlayer" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
